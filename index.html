<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner</title>

    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <div class="container">

        <div class="planner-card">

            <h1>🌍 Plan Your Adventure</h1>
            <p class="subtitle">Create your perfect trip in a few simple steps</p>

            <form>
                <div class="form-group">
                    <label for="destination">Destination</label>

                    <select id="destination">
                        <option value="">Select Destination</option>
                        <option>Goa</option>
                        <option>Manali</option>
                        <option>Kerala</option>
                        <option>Coorg</option>
                        <option>Ooty</option>
                        <option>Ladakh</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="days">Number of Days</label>
                    <input
                        type="number"
                        id="days"
                        min="1"
                        max="30"
                        placeholder="Enter number of days"
                    >
                </div>
                <div class="form-group">
                    <label>Choose Activities</label>

                    <div class="activities">

                        <label class="activity">
                            <input type="checkbox" value="Camping">
                            Camping
                        </label>

                        <label class="activity">
                            <input type="checkbox" value="Trekking">
                            Trekking
                        </label>

                        <label class="activity">
                            <input type="checkbox" value="Water Sports">
                            Water Sports
                        </label>

                        <label class="activity">
                            <input type="checkbox" value="Paragliding">
                            Paragliding
                        </label>

                        <label class="activity">
                            <input type="checkbox" value="Cycling">
                            Cycling
                        </label>

                    </div>
                </div>
                <div class="form-group">
                    <label for="budget">Budget</label>

                    <select id="budget">
                        <option value="">Select Budget</option>
                        <option>Below ₹5,000</option>
                        <option>₹5,000 - ₹10,000</option>
                        <option>₹10,000 - ₹20,000</option>
                        <option>₹20,000 - ₹50,000</option>
                        <option>Above ₹50,000</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Travel Type</label>

                    <div class="travel-types">

                        <label>
                            <input type="radio" name="travel" value="Solo">
                            Solo
                        </label>

                        <label>
                            <input type="radio" name="travel" value="Family">
                            Family
                        </label>

                        <label>
                            <input type="radio" name="travel" value="Friends">
                            Friends
                        </label>

                        <label>
                            <input type="radio" name="travel" value="Couple">
                            Couple
                        </label>

                    </div>
                </div>
                <div class="form-group">
                    <label for="date">Travel Date</label>

                    <input type="date" id="date">
                </div>
                <button type="submit">
                    ✈️ Plan My Adventure
                </button>

            </form>

        </div>

    </div>

</body>
</html>
